[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pickbuckets"
version = "0.3.0"
description = "Portable, human-readable bucketing rules for Python data workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "pickbuckets contributors" }
]
keywords = ["bucketing", "binning", "preprocessing", "rules", "data-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=1.40; python_version >= '3.10'"]
sklearn = ["scikit-learn>=1.2"]
plot = ["matplotlib>=3.7"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10,<2", "build>=1.2"]
all = [
  "pandas>=1.5",
  "polars>=1.40; python_version >= '3.10'",
  "scikit-learn>=1.2",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AlcAI-Haven/pickbuckets"
Repository = "https://github.com/AlcAI-Haven/pickbuckets"
Issues = "https://github.com/AlcAI-Haven/pickbuckets/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pickbuckets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["pickbuckets"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "polars", "polars.*", "sklearn", "sklearn.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sklearn ships no type stubs, so its base classes are typed as Any; allow
# subclassing them in the optional adapter module.
module = ["pickbuckets.sklearn"]
disallow_subclassing_any = false
